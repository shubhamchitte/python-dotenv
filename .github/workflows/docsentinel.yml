# DocSentinel: flags docs that a PR makes stale (comment), and after merge opens a
# draft PR with verified doc fixes. Remove this file to uninstall.
# Kill switch without a commit: repo variable DOCSENTINEL_ENABLED=false.
name: DocSentinel

on:
  workflow_dispatch:   # re-run fix mode for one merge commit
    inputs:
      merge_sha:
        description: Merge commit to re-run fix mode for
        required: true
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: docsentinel-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    if: vars.DOCSENTINEL_ENABLED != 'false' && github.event_name == 'pull_request'
    uses: shubhamchitte/problem-2-12-github-documentation/.github/workflows/docsentinel-check.yml@6e38fa0e5ba1f3e6b1ee5676c4e2956d95bfd356
    permissions:
      contents: read
      pull-requests: write
    with:
      docsentinel_ref: 6e38fa0e5ba1f3e6b1ee5676c4e2956d95bfd356
    secrets:
      CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Fix mode (draft docs PRs after merge). To enable: keep this job, and turn on
  # Settings > Actions > "Allow GitHub Actions to create and approve pull requests".
  fix:
    if: vars.DOCSENTINEL_ENABLED != 'false' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: shubhamchitte/problem-2-12-github-documentation/.github/workflows/docsentinel-fix.yml@6e38fa0e5ba1f3e6b1ee5676c4e2956d95bfd356
    permissions:
      contents: write
      pull-requests: write
      actions: read        # reuse the PR check's verdicts at merge time
    with:
      docsentinel_ref: 6e38fa0e5ba1f3e6b1ee5676c4e2956d95bfd356
      merge_sha: ${{ inputs.merge_sha }}
    secrets:
      CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
